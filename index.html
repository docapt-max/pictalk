<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PictureTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-badge" aria-hidden="true">🖼️</span>
      <h1>PictureTalk</h1>
    </div>

    <div class="header-center">
      <button type="button" id="next-scene-btn" class="ctrl-btn ctrl-btn-primary" title="Load a random next picture">
        <span>Next</span>
        <span aria-hidden="true">&rarr;</span>
      </button>
    </div>

    <div class="controls" aria-hidden="true"></div>
  </header>

  <main class="stage">
    <!-- Left (~65%): Picture Frame -->
    <section class="picture-stage" aria-label="Picture viewer">
      <div id="image-container" class="image-container" tabindex="0" aria-label="Picture viewer">
        <img id="main-image" src="" alt="Practice scene" draggable="false" />
        <span id="zoom-status" class="zoom-status">Tap to Zoom</span>
        <button type="button" id="reset-pan-btn" class="reset-pan-btn" hidden>Reset Zoom</button>
      </div>
    </section>

    <!-- Right (~35%): Observation Timer & One-at-a-Time Question Card -->
    <aside id="question-panel" class="question-panel" aria-label="Comprehension questions">
      <!-- Look-First State (timer & action buttons only) -->
      <div id="look-first-card" class="look-first-card">
        <div class="countdown-wrapper" id="countdown-wrapper" aria-label="30 second observation timer">
          <svg class="countdown-ring" viewBox="0 0 84 84" width="84" height="84" aria-hidden="true">
            <circle class="ring-track" cx="42" cy="42" r="36"></circle>
            <circle class="ring-progress" id="ring-progress" cx="42" cy="42" r="36"></circle>
          </svg>
          <span class="countdown-seconds" id="countdown-seconds">30s</span>
        </div>

        <button type="button" id="timer-toggle-btn" class="timer-toggle-btn">Pause Timer</button>

        <div class="look-actions">
          <button type="button" id="start-btn" class="start-btn">Start Questions &rarr;</button>
        </div>
      </div>

      <!-- Active Question Card Slot -->
      <div id="question-card-slot" class="question-card-slot" hidden></div>

      <!-- Progress & Navigation -->
      <div id="nav-area" class="nav-area" hidden>
        <div class="progress-row">
          <span id="counter" class="counter">Question 1 of 4</span>
          <div id="progress-dots" class="progress-dots" aria-hidden="true"></div>
        </div>
        <div class="nav-btns">
          <button type="button" id="prev-btn" class="nav-btn">&larr; Previous</button>
          <button type="button" id="next-btn" class="nav-btn nav-btn-primary">Next Question &rarr;</button>
        </div>
      </div>
    </aside>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
